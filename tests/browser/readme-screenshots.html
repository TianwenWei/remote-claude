<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Claude · 示例界面</title>
</head>
<body style="margin:0">
  <div id="fixture"></div>
  <script>
    // Isolate preferences before any production store is imported.
    function memoryStorage() {
      const values = new Map();
      return {
        get length() { return values.size; },
        getItem(key) { return values.get(String(key)) ?? null; },
        setItem(key, value) { values.set(String(key), String(value)); },
        removeItem(key) { values.delete(String(key)); },
        clear() { values.clear(); },
        key(index) { return Array.from(values.keys())[index] ?? null; },
      };
    }
    Object.defineProperty(window, "localStorage", { value: memoryStorage(), configurable: true });
    Object.defineProperty(window, "sessionStorage", { value: memoryStorage(), configurable: true });
    let nextId = 1;
    const callbacks = new Map();
    const subscriptions = new Map();
    window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener(_event, id) { subscriptions.delete(id); } };
    window.__readmeEmit = (event, payload) => {
      for (const [id, entry] of subscriptions) {
        if (entry.event === event) callbacks.get(entry.handler)?.({ event, id, payload });
      }
    };
    window.__TAURI_INTERNALS__ = {
      transformCallback(callback) { const id = nextId++; callbacks.set(id, callback); return id; },
      unregisterCallback(id) { callbacks.delete(id); },
      convertFileSrc: (path) => path,
      metadata: { currentWebview: { label: "main" }, currentWindow: { label: "main" } },
      async invoke(command, args) {
        if (command === "plugin:event|listen") { const id = nextId++; subscriptions.set(id, args); return id; }
        if (command === "plugin:event|unlisten") { subscriptions.delete(args.eventId); return null; }
        throw new Error("Screenshot fixture blocked native IPC: " + command);
      },
    };
  </script>
  <script type="module" src="./readme-screenshots.tsx"></script>
</body>
</html>
